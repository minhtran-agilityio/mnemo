name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only this workflow may write to the repository (it creates the draft release).
permissions:
  contents: write

# One release run per ref at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One job at a time, so the two jobs cannot both create the draft release.
      max-parallel: 1
      matrix:
        include:
          - name: macOS (Apple Silicon) dmg
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust-target: aarch64-apple-darwin
          - name: Ubuntu 22.04 deb and AppImage
            os: ubuntu-22.04
            args: --bundles deb,appimage
            rust-target: ""
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}." >&2
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1 \
            && [ "${{ strategy.job-index }}" = "0" ]; then
            echo "Tag v${version} already exists. Bump the version or use a tag push." >&2
            exit 1
          fi

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Add the Apple Silicon target
        if: matrix.rust-target != ''
        run: rustup target add ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: npm ci

      - name: Run npm run check
        run: npm run check

      # The tag name comes from the app version in package.json, so a manual run
      # and a tag push produce the same release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Mnemo v__VERSION__
          releaseBody: See the README for install steps. Bundles are unsigned.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
