name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only this workflow may write to the repository (it creates the draft release).
permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon) dmg
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust-target: aarch64-apple-darwin
          - name: Ubuntu 22.04 deb and AppImage
            os: ubuntu-22.04
            args: --bundles deb,appimage
            rust-target: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Add the Apple Silicon target
        if: matrix.rust-target != ''
        run: rustup target add ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: npm ci

      # The tag name comes from the app version in package.json, so a manual run
      # and a tag push produce the same release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Mnemo v__VERSION__
          releaseBody: See the README for install steps. Bundles are unsigned.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
