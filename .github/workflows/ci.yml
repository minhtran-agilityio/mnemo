name: CI

on:
  pull_request:
    # labeled and unlabeled re-run CI, so adding the label design-system turns the
    # design system write guard green. The full run repeats on those events: a run that
    # skipped the build would report "CI result" for a commit whose build did not pass.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only; every main commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides whether the change can affect the build or the tests. Docs, notes
  # and Claude config cannot, so the heavy jobs skip them to save CI minutes.
  # The workflow itself always runs, so the "CI result" job below always
  # reports and can be a required check.
  changes:
    name: Detect code changes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the changed files
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # Fail closed: any doubt about the diff means run the full CI.
          run_all() { echo "$1 Running the full CI."; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }

          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE...$PR_HEAD"
          else
            # A new branch or a force push has no usable "before" commit.
            if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              run_all "No previous commit to compare with."
            fi
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi

          # --no-renames lists both paths of a move, so code moved into docs/ still counts.
          files="$(git diff --name-only --no-renames "$range")" || run_all "Could not diff $range."
          [ -n "$files" ] || run_all "The diff $range lists no files."

          code=false
          while IFS= read -r f; do
            case "$f" in
              # The acceptance tests read the top-level docs and .github/. Text files
              # inside the app sources can be compiled in (for example prompts).
              CLAUDE.md | README.md | .github/* | tests/* | src-tauri/* | ui/*) code=true ;;
              docs/* | notes/* | specs/* | .claude/* | LICENSE*) ;;
              *.md | *.markdown | *.txt) ;;
              *) code=true ;;
            esac
            if [ "$code" = true ]; then
              echo "Code change: $f"
              break
            fi
          done <<< "$files"

          [ "$code" = true ] || { echo "Changed files:"; echo "$files"; echo "Only docs or notes changed. Skipping the build and tests."; }
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # With no arguments it installs the toolchain pinned in rust-toolchain.toml
      # (rustup show stopped installing it in rustup 1.28).
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: npm ci

      - name: Check (format, lint, type check, tests)
        run: npm run check

      - name: Debug build
        run: npx tauri build --debug --no-bundle

  # Fails a pull request that changes ui/src/ds/ without the label design-system.
  # How it decides is written at the top of scripts/ds-write-guard.mjs and in
  # DESIGN.md section 6, rule 4. Labels reach the script through env as JSON,
  # never through the shell text.
  ds-write-guard:
    name: Design system write guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ui/src/ds changes against the label
        # bash runs with -eo pipefail here, so a failing git diff fails the step.
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DS_GUARD_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: git diff --name-only --no-renames "$PR_BASE...$PR_HEAD" | node scripts/ds-write-guard.mjs

  # One stable check for branch protection. It passes when the checks passed
  # or were skipped for a docs-only change, and fails otherwise.
  result:
    name: CI result
    needs: [changes, check, ds-write-guard]
    # Not always(): a run cancelled by a newer push should not report a failure.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Report the result
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
          DS_GUARD: ${{ needs.ds-write-guard.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "Detect code changes: $CHANGES. Build and tests: $CHECK. Design system write guard: $DS_GUARD."
          if [ "$CHANGES" != "success" ]; then
            echo "Detecting code changes did not succeed." >&2
            exit 1
          fi
          if [ "$CHECK" != "success" ] && [ "$CHECK" != "skipped" ]; then
            echo "The build and tests did not pass." >&2
            exit 1
          fi
          # The write guard runs on pull requests only; on a push it is skipped.
          if [ "$DS_GUARD" != "success" ] && { [ "$DS_GUARD" != "skipped" ] || [ "$EVENT" = "pull_request" ]; }; then
            echo "The design system write guard did not pass." >&2
            exit 1
          fi
