[package]
name = "mnemo"
version = "0.1.0"
description = "Mnemo: a local-first desktop app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mnemo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
log = { version = "0.4", features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# #25: the Rust core reads the page (owner decision 1); blocking client, rustls, no system proxy.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "charset", "gzip"] }
# HTML to text: html5ever's tokenizer only (no tree), so the walk is linear (#25 review).
html5ever = "0.40"
encoding_rs = "0.8"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
